<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vortex Rival</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0e0b16;
        --panel: #1a1626;
        --panel-2: #241e35;
        --line: #3a3150;
        --text: #efeaf8;
        --muted: #a49cb8;
        --accent: #ffcf3f;
        --ok: #38d39f;
        --bad: #ff5d73;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { display: flex; height: 100%; gap: 0; }
      #game { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }
      #dev { flex: 0 0 360px; height: 100%; overflow-y: auto; background: var(--panel);
        border-left: 1px solid var(--line); padding: 14px; }
      body.obs #dev { display: none; }
      body.obs { background: transparent; }
      @media (max-width: 760px) {
        #app { flex-direction: column; }
        #game { height: 70vh; }
        #dev { flex-basis: auto; height: auto; border-left: 0; border-top: 1px solid var(--line); }
      }
      #dev h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
        margin: 18px 0 8px; }
      #dev h2:first-child { margin-top: 0; }
      #dev .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
      #dev button, #dev input, #dev select { font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
      #dev input { flex: 1 1 140px; min-width: 0; }
      #dev button { cursor: pointer; }
      #dev button:hover { border-color: var(--accent); }
      #dev button.primary { background: var(--accent); color: #1b1400; border-color: var(--accent); font-weight: 600; }
      #dev button.on { background: var(--ok); color: #04140e; border-color: var(--ok); }
      #dev .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
      #dev .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      #dev .dot.connected { background: var(--ok); }
      #dev .dot.connecting { background: var(--accent); }
      #dev .dot.error { background: var(--bad); }
      #dev .gift { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
      #dev .gift small { color: var(--muted); font-size: 11px; }
      #dev pre { background: #0b0912; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
        height: 220px; overflow: auto; font-size: 11px; margin: 0; white-space: pre-wrap; word-break: break-all; }
      #dev .hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <aside id="dev"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
